name: Test and build installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:linux
      - run: npm run dist:rpm
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-Linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-Windows-x64
          path: dist/professional-release/*-Setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-macOS
          path: |
            dist/professional-release/*.dmg
            dist/professional-release/*.zip
          if-no-files-found: error
          retention-days: 30
