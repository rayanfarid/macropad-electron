name: Test and build installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
      - name: Install dependencies (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm ci
      - run: npm run check
      - run: npm test
      - name: Build Linux packages (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm run dist:linux
      - name: Build Linux RPM (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm run dist:rpm
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-Linux-x64
          path: |
            dist/professional-release/*.AppImage
            dist/professional-release/*.deb
            dist/professional-release/*.pacman
            dist/professional-release/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm ci
      - run: npm run check
      - run: npm test
      - name: Build Windows installers (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-Windows-x64
          path: dist/professional-release/*-Setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm ci
      - run: npm run check
      - run: npm test
      - name: Build macOS installers (retry transient download failures)
        shell: bash
        run: bash .github/scripts/retry-transient-downloads.sh npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Macropad-Studio-macOS
          path: |
            dist/professional-release/*.dmg
            dist/professional-release/*.zip
          if-no-files-found: error
          retention-days: 30
